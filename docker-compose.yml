# One process: Express + Socket.IO + the built Vite client.
# Bind to loopback so host nginx can reverse-proxy.
# Host port 3010 — 3001 is already FinSense on this box.
# Persist parlor accounts / access requests on the host.

services:
  baithak:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      PUBLIC_URL: ${PUBLIC_URL:-https://games.zakarias.in}
    ports:
      - "127.0.0.1:${HOST_PORT:-3010}:3001"
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
